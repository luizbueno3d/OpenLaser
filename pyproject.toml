[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlaser"
version = "0.2.0"
description = "Safety-first open-source workspace for galvo lasers, gantry lasers, and pen plotters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luiz Bueno" }]
keywords = ["mopa", "co2", "diode", "plotter", "grbl", "galvo", "laser", "jcz", "lmc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["galvoplotter"]

[project.optional-dependencies]
hardware = ["pyusb"]
dev = []

[project.scripts]
openlaser = "mopa_luiz.cli:main"
openmopa = "mopa_luiz.cli:main"

[tool.setuptools]
packages = ["mopa_luiz"]
